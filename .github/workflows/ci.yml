name: Tests
# Branch pushes and pull requests only: a release pushes main and its tag together, and
# the tag's commit is the one main was just tested at. Changes that can't affect the app
# (docs, the release and cache workflows) don't need a test run.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"

# A newer push to the same branch makes an unfinished run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Time limits a few times the usual run, so a hung step fails fast instead of after 6 hours.
  linux:
    name: Tests · Linux (engine, playback, UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      # Only what the tests use: ffmpeg makes the fixtures, libmpv2 plays them. Skipping
      # recommends and the man-db index rebuild keeps the install quick. GitHub's Ubuntu
      # mirror has stalled for 15+ minutes (trickling, so apt's own timeouts don't fire),
      # both fetching the package lists and downloading the packages: give the update 2
      # minutes and the install 4, and if either stalls switch to Ubuntu's main archive
      # and do both again.
      - name: Install ffmpeg and libmpv
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          fetch() {
            sudo timeout 120 apt-get $APT update &&
            sudo timeout 240 apt-get $APT install -y --no-install-recommends ffmpeg libmpv2
          }
          if ! fetch; then
            echo "::warning::GitHub's Ubuntu mirror stalled; retrying from archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fetch
          fi
      - run: ./build/test.sh

  # Tests only: the Windows zip itself is built by the Release workflow.
  windows:
    name: Tests · Windows (engine, UI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Torrent engine tests
        working-directory: native/atlas-torrent
        run: cargo test --lib
      - name: UI and view model tests
        run: dotnet test tests/AtlasPlayer.App.Tests --filter "Category!=desktop" --logger GitHubActions
      # Real windows on the runner's desktop: the fullscreen pointer hidden over a child window of
      # another thread (as mpv's video is) and a drop target revoked there. A runner's session may
      # show no pointer at all, so this step reports (annotations) without failing the run.
      - name: Pointer and drop targets on real windows
        continue-on-error: true
        run: dotnet test tests/AtlasPlayer.App.Tests --filter "Category=desktop" --logger GitHubActions
      # The DVD ripper's libdvdread and libdvdcss, as the Windows zip ships them (build/build-dvdread-win.sh).
      - name: DVD reading (libdvdread)
        env:
          ATLAS_NATIVE_DIR: ${{ github.workspace }}/packaging/dvd/win64
          ATLAS_REQUIRE_DVDREAD: "1"
        run: dotnet test tests/AtlasPlayer.Core.Tests --filter "FullyQualifiedName~DvdReadNativeTests" --logger GitHubActions
      # QTGMC as the Windows zip ships it (build/fetch-qtgmc-win.sh), in a folder with a space in
      # its name like "Atlas Player": the app's own lookup and probe, then every preset on a blank
      # PAL clip (build/qtgmc-check.py). Beta.11's didn't load at all.
      - name: QTGMC (VapourSynth and its plugins)
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/Atlas Player"
          ./build/fetch-qtgmc-win.sh "$DIR"
          VS="$(cygpath -w "$DIR/vapoursynth")"
          if ! OUT="$("$DIR/vapoursynth/python.exe" -I "$(cygpath -w build/qtgmc-check.py)" "$VS\\Lib\\site-packages" "$VS\\plugins" 2>&1)"; then
            echo "::error::QTGMC doesn't run on Windows: $(echo "$OUT" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$OUT"
          ATLAS_VAPOURSYNTH="$VS" dotnet test tests/AtlasPlayer.Core.Tests --filter "FullyQualifiedName~Prompt12CoreTests" --logger GitHubActions
