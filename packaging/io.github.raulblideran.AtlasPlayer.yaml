# Flatpak manifest for Atlas Player.
#
# The app is three pieces: the C#/Avalonia UI, the Rust torrent engine
# (libatlas_torrent.so) and libmpv. The freedesktop runtime carries none of
# libmpv's stack beyond the basics, so most of this file builds it: libplacebo
# (the gpu-next renderer that does the HDR tonemapping), libass (subtitles),
# LuaJIT (the I statistics overlay is a Lua script), libXpresent (mpv's X11
# backend requires it), libdvdnav and libbluray (VIDEO_TS and BDMV folders)
# and ffmpeg itself.
#
# ffmpeg is rebuilt rather than taken from the runtime because the runtime's
# copy leaves out HEVC, H.264, AAC, AC-3/E-AC-3 and other patent-encumbered
# decoders, and playing everything is the point of a video player. mpv is
# GPL, which makes this bundle GPL-3.0-or-later.
app-id: io.github.raulblideran.AtlasPlayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.dotnet10
command: atlas-player

finish-args:
  # Avalonia 11 has no Wayland backend, so the window is X11 (XWayland on a
  # Wayland session). mpv renders into a child of that X11 window, which is
  # why the app forces mpv's x11vk context on Linux.
  - --socket=x11
  - --share=ipc
  - --device=dri                 # Vulkan rendering, VA-API/Vulkan decoding
  - --socket=pulseaudio
  # Torrents: trackers, DHT and peers, plus the localhost stream server mpv
  # reads from.
  - --share=network
  # Read-only access to everything, because the file chooser portal hands out
  # one file at a time: subtitles next to a video are auto-loaded by name, and
  # recent files and command-line paths have to open again later.
  - --filesystem=host:ro
  # Screenshots are saved to ~/Pictures/Atlas Player.
  - --filesystem=xdg-pictures
  # Downloaded videos (YouTube and other sites) are saved to ~/Downloads.
  - --filesystem=xdg-download
  # Ripped CDs go to ~/Music, ripped DVDs to ~/Videos.
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  # Settings from before the app was renamed (its old ID), read once on the first start
  # (PortablePaths.MigrateFlatpakSettings).
  - --filesystem=~/.var/app/io.github.raulblideran.Paramaja/config:ro
  # Physical DVDs, Blu-rays and CDs: the optical drive (/dev/sr0) is a raw device, read for
  # playback and ripping (SG_IO).
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - /share/lua
  - /bin/luajit*
  - '*.a'
  - '*.la'
  # VapourSynth's headers were for building BestSource.
  - /lib/vapoursynth/python/vapoursynth/include
  - /lib/vapoursynth/python/vapoursynth/pkgconfig

modules:
  # ---- mpv's X11 backend requires XPresent; the runtime does not ship it ---
  - name: libXpresent
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXpresent-1.0.1.tar.xz
        sha256: b964df9e5a066daa5e08d2dc82692c57ca27d00b8cc257e8e960c9f1cf26231b

  # ---- LuaJIT, for mpv's built-in stats overlay (the I key) -------------
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=/app amalg
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: a4c064539ea931274d407e1249b4bb575424a0f4

  # ---- subtitles ---------------------------------------------------------
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # ---- gpu-next: HDR -> SDR tonemapping, scaling, Dolby Vision ----------
  # 7.387 is the oldest release mpv 0.42 accepts. Shader compilation goes
  # through the runtime's shaderc.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # ---- DVDs and Blu-rays ----------------------------------------------------
  # libdvdcss reads store-bought (CSS-encrypted) DVDs. Blu-ray encryption (AACS)
  # is not supported.
  - name: libdvdcss
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  - name: libdvdread
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Dlibdvdcss=enabled
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  - name: libudfread
    buildsystem: meson
    config-opts:
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libudfread/libudfread-1.2.0.tar.xz
        sha256: bb477cbd4cfbfc7787d9d05b71ee5e70430f5cfebf1297497f7e83547958050f

  # ---- x264 and x265: the DVD ripper's H.264 and H.265 MKVs ---------------
  # Only the libraries (no command-line tools): FFmpeg encodes with them. Neither is in the
  # runtime (it ships no encoders of either); both are GPL, as the bundle is.
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      # The stable branch.
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  - name: x265
    buildsystem: cmake-ninja
    subdir: source
    config-opts:
      - -DENABLE_SHARED=ON
      - -DENABLE_CLI=OFF
      # x265 4.1 asks for CMake 2.8 and two policies CMake 4 no longer has (removed below).
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz
        sha256: a31699c6a89806b74b0151e5e6a7df65de4b49050482fe5ebf8a4379d7af8f29
      - type: shell
        commands:
          - sed -i -e '/cmake_policy(SET CMP0025 OLD)/d' -e '/cmake_policy(SET CMP0054 OLD)/d' source/CMakeLists.txt

  # ---- ffmpeg, with every decoder ----------------------------------------
  # The ffmpeg and ffprobe programs are built too: yt-dlp needs them to merge the
  # separate video and audio streams of a download and to embed its cover art, and the
  # DVD ripper reads DVDs and encodes with them (so the DVD libraries, x264 and x265 above
  # come first).
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-ffplay
      - --disable-doc
      - --disable-debug
      - --enable-gpl
      # OpenSSL 3 is Apache-2.0, which only GPLv3 can combine with -- and the
      # bundle is GPL-3.0-or-later already, because of mpv.
      - --enable-version3
      - --enable-openssl         # https:// streams
      - --enable-libdav1d
      - --enable-libdrm
      - --enable-vaapi
      - --enable-vulkan
      # FFmpeg's DVD-Video reader, for the DVD ripper's MKVs (libdvdread decrypts with libdvdcss).
      - --enable-libdvdread
      - --enable-libdvdnav
      # The DVD ripper's MKVs in H.264 and H.265 (the modules above).
      - --enable-libx264
      - --enable-libx265
      # NVENC off: with the 25.08 runtime's nv-codec-headers 13, ffmpeg 8.0's
      # nvenc.c failed to compile (a renamed field; the same fix Apricot Studio
      # needed), and nothing here encodes with it: a player only decodes, the
      # DVD ripper uses x264 and x265, and NVDEC/CUVID are unaffected.
      - --disable-nvenc
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
        sha256: 1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433

  # No BD-J (Java menus): titles play directly.
  - name: libbluray
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_tools=false
      - -Denable_examples=false
      - -Dbdj_jar=disabled
      - -Dembed_udfread=false
    sources:
      # 1.5.1 is a git tag only (VideoLAN published no tarball for it).
      - type: git
        url: https://code.videolan.org/videolan/libbluray.git
        tag: 1.5.1
        commit: a24f4fad4d62893de647abc8671397747b2359dd

  # ---- libmpv ------------------------------------------------------------
  # Only the library: the app is the player, so the mpv command-line binary,
  # its OSC and its manual are not built.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dx11=enabled
      - -Dwayland=enabled
      - -Dvulkan=enabled
      - -Degl=enabled
      - -Dvaapi=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dlcms2=enabled
      - -Dlibarchive=enabled
      - -Dlibbluray=enabled
      - -Ddvdnav=enabled
      - -Dcdda=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
        sha256: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd

  # ---- libVLC: plays discs with their menus ------------------------------
  # mpv plays everything else but has no DVD or Blu-ray menu support, so discs
  # go through libVLC, and so do Audio CDs (its CD-DA reader). Only the library
  # is built (no VLC app or interfaces), with the disc, FFmpeg and PulseAudio
  # modules a disc player needs. VLC's own libplacebo support is off: it
  # predates the libplacebo mpv uses. vlc-bwdif.patch adds BWDIF to VLC's
  # deinterlacer, run for its yadif2x mode, so discs deinterlace like files.
  - name: vlc
    build-options:
      env:
        BUILDCC: gcc -std=gnu99 # VLC builds a few helper tools with the native compiler
      # libVLC's plugin cache (below) records each plugin's size and time. Splitting debug info
      # out afterwards changed the sizes, which made the cache stale: every plugin was opened at
      # each start. So no debug info, and nothing touches the plugins after the cache is made:
      # the modules after this one don't split debug info either, as flatpak-builder's
      # post-processing of a later module reaches back to libVLC's files.
      cflags: -O2 -pipe
      cflags-override: true
      cxxflags: -O2 -pipe
      cxxflags-override: true
      no-debuginfo: true
    config-opts:
      - --disable-vlc
      - --disable-qt
      - --disable-skins2
      - --disable-lua
      - --disable-ncurses
      - --disable-nls
      - --disable-a52
      - --disable-mad
      - --disable-mod
      - --disable-mpc
      - --disable-taglib
      - --disable-live555
      - --disable-libplacebo
      - --disable-decklink
      - --disable-jack
      - --disable-sndio
      - --disable-alsa
      - --disable-v4l2
      - --disable-libcddb
      - --disable-addonmanagermodules
      - --disable-vlm
      # Stream output stays in: libVLC's snapshots (a disc's screenshots) encode their PNG through
      # it. Without it every DVD screenshot failed ("Encoding support not compiled-in!").
      - --disable-chromecast
      - --disable-update-check
      - --disable-wayland
      - --disable-dbus
      - --enable-dvdnav
      - --enable-dvdread
      - --enable-bluray
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-pulse
    post-install:
      # The plugin cache makes libVLC start in milliseconds instead of opening every plugin.
      # Installed Flatpak files all have the time 0, so the cache is made with that time.
      - find /app/lib/vlc/plugins -name '*.so' -exec touch -h -d @0 {} +
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    cleanup:
      - /share/vlc/lua
      - /share/applications
      - /share/icons
      - /share/metainfo
      - /share/kde4
      - /share/locale
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
      - type: patch
        path: vlc/vlc-bwdif.patch

  # ---- the torrent engine (Rust) -----------------------------------------
  # Cargo needs its crates and a flatpak build has no network. --share=network
  # is fine for a local build; for Flathub, run
  # packaging/flatpak/generate-sources.sh, add cargo-sources.json to `sources`
  # and drop the build-args line.
  - name: atlas-torrent
    buildsystem: simple
    build-options:
      no-debuginfo: true # keeps libVLC's plugin cache valid (see vlc)
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/atlas-torrent/cargo
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --lib --manifest-path native/atlas-torrent/Cargo.toml
      - install -Dm755 native/atlas-torrent/target/release/libatlas_torrent.so -t /app/lib/atlas-player/
    sources:
      - type: dir
        path: ..
        # The checkout's own build outputs: gigabytes, and none of them belong
        # in a clean build.
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/atlas-torrent/target
          - src/AtlasPlayer.App/bin
          - src/AtlasPlayer.App/obj
          - src/AtlasPlayer.Core/bin
          - src/AtlasPlayer.Core/obj
          - tests

  # ---- QTGMC, for DVD rips only (playback keeps BWDIF) --------------------
  # VapourSynth's own Python module (the manylinux wheel: the core, its filters and vspipe), run
  # by the runtime's python3; havsfunc r33 (its last release with QTGMC) and the scripts it
  # imports; and every plugin QTGMC calls (Qtgmc.Namespaces). VapourSynth R82 loads API 4
  # plugins only: MVTools v29 comes from its wheel, installed as pip would (into VapourSynth's
  # own plugin folder, which loads on its own, with the FFTW it links two folders up); znedi3,
  # RemoveGrain, fmtconv, MiscFilters, EEDI3m and FFT3DFilter are the builds VapourSynth's
  # package index (vsrepo) lists, self-contained (libc and libstdc++ only); BestSource, which
  # reads the title's copy, is built here against this FFmpeg rather than taken as its 80 MB
  # prebuilt (FFmpeg linked in). Everything goes in /app/lib/vapoursynth, where the app looks
  # (AtlasPlayer.Core/Ripping/Dvd/Qtgmc.cs); its script loads the plugins folder by path.
  # qtgmc-check (after BestSource) runs QTGMC with all of it.
  - name: vapoursynth
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/vapoursynth/python/mvsfunc /app/lib/vapoursynth/plugins
      - python3 -m zipfile -e vapoursynth.whl /app/lib/vapoursynth/python/
      - python3 -m zipfile -e vapoursynth-mvtools.whl /app/lib/vapoursynth/python/
      - rm -f /app/lib/vapoursynth/python/vapoursynth/*.pyi
      # VapourSynth R82 no longer takes a Python keyword with a leading underscore (_lambda); havsfunc
      # r33 passes two to MVTools. The trailing one (lambda_) is how it's spelt now.
      - sed -E 's/\b_lambda=/lambda_=/g; s/\b_global=/global_=/g' havsfunc.py > /app/lib/vapoursynth/python/havsfunc.py
      - test "$(grep -cE '\b_(lambda|global)=' /app/lib/vapoursynth/python/havsfunc.py)" = 0
      - install -Dm644 adjust.py -t /app/lib/vapoursynth/python/
      - install -Dm644 mvsfunc.py -t /app/lib/vapoursynth/python/mvsfunc/
      - install -Dm644 mvsfunc-init.py /app/lib/vapoursynth/python/mvsfunc/__init__.py
      - install -Dm644 mvsfunc-metadata.py /app/lib/vapoursynth/python/mvsfunc/_metadata.py
      - install -Dm755 znedi3/libvsznedi3.so removegrain/libremovegrain.so fmtconv/libfmtconv.so misc/libmiscfilters.so
        eedi3m/libeedi3m.so fft3dfilter/libfft3dfilter.so -t /app/lib/vapoursynth/plugins/
      # znedi3 looks for its weights next to itself.
      - install -Dm644 nnedi3_weights.bin -t /app/lib/vapoursynth/plugins/
      - python3 -c "import sys; sys.path.insert(0, '/app/lib/vapoursynth/python'); import vapoursynth as vs; print(vs.core.version())"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3c/30/55b464fe29960af3e8e8254eb236f5e3164c28a6ce66f9706f5d5567ddd4/vapoursynth-82-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 9bd85641d3655c06ff90c73042204fbcf6db7bd26f8ae9d60a7ee17acf534f2e
        dest-filename: vapoursynth.whl
      - type: file
        url: https://raw.githubusercontent.com/HomeOfVapourSynthEvolution/havsfunc/r33/havsfunc.py
        sha256: 4da2839544b1ce9382db670b069dc358228251d147dad91f740a860840e04924
      - type: file
        url: https://raw.githubusercontent.com/HomeOfVapourSynthEvolution/mvsfunc/865c7486ca860d323754ec4774bc4cca540a7076/mvsfunc/mvsfunc.py
        sha256: 1adeb385d19bac1f8c541b655d1f98a38e18c9a0065d4483c25184c22908a984
      - type: file
        url: https://raw.githubusercontent.com/HomeOfVapourSynthEvolution/mvsfunc/865c7486ca860d323754ec4774bc4cca540a7076/mvsfunc/__init__.py
        sha256: a08e2bc2d1b255ffa373ef52a63506da6a926e72a4d115aaabe5e95272016d89
        dest-filename: mvsfunc-init.py
      - type: file
        url: https://raw.githubusercontent.com/HomeOfVapourSynthEvolution/mvsfunc/865c7486ca860d323754ec4774bc4cca540a7076/mvsfunc/_metadata.py
        sha256: 654d75ba830a969d5940e1d6a18a7801a0a8b9860fd9aa85688f954ee0d5bd53
        dest-filename: mvsfunc-metadata.py
      - type: file
        url: https://raw.githubusercontent.com/dubhatervapoursynth/vapoursynth-adjust/a3af7cb57cb37747b0667346375536e65b1fed17/adjust.py
        sha256: 22b25995ef37e6d003c2999e51e80d1570376413db9067f703fe4fcef4600bfa
      - type: file
        url: https://raw.githubusercontent.com/dubhatervapoursynth/vapoursynth-nnedi3/82993ff21cf569776fc1a7e5bb60235c00bbeea3/src/nnedi3_weights.bin
        sha256: 27f382430435bb7613deb1c52f3c79c300c9869812cfe29079432a9c82251d42
      - type: file
        url: https://files.pythonhosted.org/packages/a1/7b/fe16b0dd4d032387e39f951e642baf2da4d37086fba4acaf87283a0a257a/vapoursynth_mvtools-29-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: ceee185fe4a6fd4058612823bfb93c4c64e981d661248108de99a6560553bc2a
        dest-filename: vapoursynth-mvtools.whl
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/xxx.abc.znedi3/3bd542a/linux-glibc-x86_64/2026-01-10T23.46.05%2B00.00Z/ZNEDI3-3bd542a-linux-glibc-x86_64.zip
        sha256: 4d30d49cb57ad61c94d61f4b226eb281611b9ed58a8e49fef911f23aa01a58ae
        strip-components: 0
        dest: znedi3
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/com.vapoursynth.removegrainvs/git-89ca38a/linux-glibc-x86_64/2024-10-09T22.47.43%2B00.00Z/RemoveGrain-git-89ca38a-linux-glibc-x86_64.zip
        sha256: 280774257c3d2385a832f2e6b3e594cdd6e4946456c059ef86fc263f7032e4be
        strip-components: 0
        dest: removegrain
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/fmtconv/git-18a9cecb/linux-glibc-x86_64/2024-10-10T14.44.42%2B00.00Z/fmtconv-git-18a9cecb-linux-glibc-x86_64.zip
        sha256: f0175362854b2d921f9127043a3db6aad3c9d54e8fd92d649b5fa7f190753528
        strip-components: 0
        dest: fmtconv
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/com.vapoursynth.misc/git-07e0589/linux-glibc-x86_64/2024-10-09T22.47.34%2B00.00Z/Miscfilters-git-07e0589-linux-glibc-x86_64.zip
        sha256: 2771e2f1ef0b4309324b378b0de3d8fc83b5c466f88ea41a46dd3eae8db3654e
        strip-components: 0
        dest: misc
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/com.holywu.eedi3/r8/linux-glibc-x86_64/2026-01-15T20.47.25%2B00.00Z/EEDI3m-r8-linux-glibc-x86_64.zip
        sha256: 3d11d7925d1f8cfd58ec00044f7efaa40e29a451a56745ce446f43d0e24c514a
        strip-components: 0
        dest: eedi3m
      - type: archive
        url: https://github.com/Stefan-Olt/vs-plugin-build/releases/download/vsplugin/systems.innocent.fft3dfilter/R2/linux-glibc-x86_64/2024-10-09T17.43.07%2B00.00Z/FFT3DFilter-R2-linux-glibc-x86_64.zip
        sha256: b1efd47b3c145ec1786c34eeff8f266c6d5600004c151d7c180486207846252b
        strip-components: 0
        dest: fft3dfilter

  # BestSource R23 (FFmpeg 9 and up), the plugin only: no AviSynth interface, no GPU decoding.
  # Built with meson from its wheel (the SDK has none); libp2p, which its wrap would fetch from
  # git HEAD, is pinned here instead.
  - name: bestsource
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/vapoursynth/python
    build-commands:
      - python3 -m zipfile -e meson.whl meson-pkg
      - cp -r subprojects/packagefiles/libp2p/. subprojects/libp2p/
      - PYTHONPATH=$PWD/meson-pkg:$PYTHONPATH python3 -m mesonbuild.mesonmain setup build --prefix=/app --buildtype=release
        --wrap-mode=nodownload -Denable_plugin=true -Denable_avisynth=false -Denable_gpu=disabled
      - ninja -C build
      - install -Dm755 build/libbestsource.so /app/lib/vapoursynth/plugins/libbestsource.so
    sources:
      - type: git
        url: https://github.com/vapoursynth/bestsource.git
        tag: R23
        commit: bca32dac44794d93f3e580f9573c58c4a0e7671f
      - type: git
        url: https://github.com/sekrit-twc/libp2p.git
        commit: 869fa993041f9f3af7d9ac8b10158920c6ddce66
        dest: subprojects/libp2p
      - type: file
        url: https://files.pythonhosted.org/packages/57/99/36cd25f9598eef70db97577440a70a360af505f6f01c2338a18d1556079c/meson-1.12.1-py3-none-any.whl
        sha256: 930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02
        dest-filename: meson.whl

  # QTGMC runs with what the two modules above put in /app/lib/vapoursynth (build/qtgmc-check.py):
  # every plugin it calls loads, and every preset deinterlaces a blank PAL clip.
  - name: qtgmc-check
    buildsystem: simple
    build-commands:
      - python3 -I qtgmc-check.py /app/lib/vapoursynth/python /app/lib/vapoursynth/plugins
    sources:
      - type: file
        path: ../build/qtgmc-check.py

  # ---- the application (C# / Avalonia) -----------------------------------
  # Published self-contained, so the .NET runtime travels with the app rather
  # than being another extension to install. Same network note as above, with
  # nuget-sources.json from the same script.
  - name: atlas-player
    buildsystem: simple
    build-options:
      no-debuginfo: true # keeps libVLC's plugin cache valid (see vlc)
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
        DOTNET_CLI_HOME: /run/build/atlas-player
        NUGET_PACKAGES: /run/build/atlas-player/nuget
      build-args:
        - --share=network
    build-commands:
      - dotnet publish src/AtlasPlayer.App -c Release -r linux-x64 --self-contained true
        -p:DebugType=none -p:AtlasNativeRid=none -o /app/lib/atlas-player
      - install -Dm755 packaging/flatpak/atlas-player.sh /app/bin/atlas-player
      # YouTube and other sites: yt-dlp, QuickJS (the JavaScript runtime YouTube
      # needs) and ffmpeg (merges downloads), where the app looks for them.
      - install -Dm755 yt-dlp_linux /app/lib/atlas-player/yt-dlp
      - install -Dm755 qjs-linux-x86_64 /app/lib/atlas-player/qjs
      - ln -sf /app/bin/ffmpeg /app/lib/atlas-player/ffmpeg
      - ln -sf /app/bin/ffprobe /app/lib/atlas-player/ffprobe
      - install -Dm644 packaging/io.github.raulblideran.AtlasPlayer.svg
        -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 src/AtlasPlayer.App/Assets/atlas-player-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.raulblideran.AtlasPlayer.png
      - install -Dm644 packaging/io.github.raulblideran.AtlasPlayer.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/io.github.raulblideran.AtlasPlayer.metainfo.xml
        -t /app/share/metainfo/
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp_linux
        sha256: 249ddb058234276bc449b9cd9492aad9f133bda5923c61a9e39983ae114ef17d
      - type: file
        url: https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-linux-x86_64
        sha256: 85ded23b9fabe8c1644fc40a8d2bbdd71157affcbd807359c618cc717ee24d7d
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/atlas-torrent/target
          - src/AtlasPlayer.App/bin
          - src/AtlasPlayer.App/obj
          - src/AtlasPlayer.Core/bin
          - src/AtlasPlayer.Core/obj
          - tests
