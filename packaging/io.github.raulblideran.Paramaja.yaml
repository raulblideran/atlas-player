# Flatpak manifest for Paramaja.
#
# The app is three pieces: the C#/Avalonia UI, the Rust torrent engine
# (libparamaja_torrent.so) and libmpv. The freedesktop runtime carries none of
# libmpv's stack beyond the basics, so most of this file builds it: libplacebo
# (the gpu-next renderer that does the HDR tonemapping), libass (subtitles),
# LuaJIT (the I statistics overlay is a Lua script), libXpresent (mpv's X11
# backend requires it), libdvdnav and libbluray (VIDEO_TS and BDMV folders)
# and ffmpeg itself.
#
# ffmpeg is rebuilt rather than taken from the runtime because the runtime's
# copy leaves out HEVC, H.264, AAC, AC-3/E-AC-3 and other patent-encumbered
# decoders, and playing everything is the point of a video player. mpv is
# GPL, which makes this bundle GPL-3.0-or-later.
app-id: io.github.raulblideran.Paramaja
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.dotnet10
command: paramaja

finish-args:
  # Avalonia 11 has no Wayland backend, so the window is X11 (XWayland on a
  # Wayland session). mpv renders into a child of that X11 window, which is
  # why the app forces mpv's x11vk context on Linux.
  - --socket=x11
  - --share=ipc
  - --device=dri                 # Vulkan rendering, VA-API/Vulkan decoding
  - --socket=pulseaudio
  # Torrents: trackers, DHT and peers, plus the localhost stream server mpv
  # reads from.
  - --share=network
  # Read-only access to everything, because the file chooser portal hands out
  # one file at a time: subtitles next to a video are auto-loaded by name, and
  # recent files and command-line paths have to open again later.
  - --filesystem=host:ro
  # Screenshots are saved to ~/Pictures/Paramaja.
  - --filesystem=xdg-pictures
  # Downloaded videos (YouTube and other sites) are saved to ~/Downloads.
  - --filesystem=xdg-download
  # Ripped CDs go to ~/Music, ripped DVDs to ~/Videos.
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  # Physical DVDs, Blu-rays and CDs: the optical drive (/dev/sr0) is a raw device, read for
  # playback and ripping (SG_IO).
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - /share/lua
  - /bin/luajit*
  - '*.a'
  - '*.la'

modules:
  # ---- mpv's X11 backend requires XPresent; the runtime does not ship it ---
  - name: libXpresent
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXpresent-1.0.1.tar.xz
        sha256: b964df9e5a066daa5e08d2dc82692c57ca27d00b8cc257e8e960c9f1cf26231b

  # ---- LuaJIT, for mpv's built-in stats overlay (the I key) -------------
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=/app amalg
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: a4c064539ea931274d407e1249b4bb575424a0f4

  # ---- subtitles ---------------------------------------------------------
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # ---- gpu-next: HDR -> SDR tonemapping, scaling, Dolby Vision ----------
  # 7.387 is the oldest release mpv 0.42 accepts. Shader compilation goes
  # through the runtime's shaderc.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65

  # ---- DVDs and Blu-rays ----------------------------------------------------
  # libdvdcss reads store-bought (CSS-encrypted) DVDs. Blu-ray encryption (AACS)
  # is not supported.
  - name: libdvdcss
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  - name: libdvdread
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Dlibdvdcss=enabled
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  - name: libudfread
    buildsystem: meson
    config-opts:
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libudfread/libudfread-1.2.0.tar.xz
        sha256: bb477cbd4cfbfc7787d9d05b71ee5e70430f5cfebf1297497f7e83547958050f

  # ---- x264 and x265: the DVD ripper's H.264 and H.265 MKVs ---------------
  # Only the libraries (no command-line tools): FFmpeg encodes with them. Neither is in the
  # runtime (it ships no encoders of either); both are GPL, as the bundle is.
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      # The stable branch.
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  - name: x265
    buildsystem: cmake-ninja
    subdir: source
    config-opts:
      - -DENABLE_SHARED=ON
      - -DENABLE_CLI=OFF
      # x265 4.1 asks for CMake 2.8 and two policies CMake 4 no longer has (removed below).
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz
        sha256: a31699c6a89806b74b0151e5e6a7df65de4b49050482fe5ebf8a4379d7af8f29
      - type: shell
        commands:
          - sed -i -e '/cmake_policy(SET CMP0025 OLD)/d' -e '/cmake_policy(SET CMP0054 OLD)/d' source/CMakeLists.txt

  # ---- ffmpeg, with every decoder ----------------------------------------
  # The ffmpeg and ffprobe programs are built too: yt-dlp needs them to merge the
  # separate video and audio streams of a download and to embed its cover art, and the
  # DVD ripper reads DVDs and encodes with them (so the DVD libraries, x264 and x265 above
  # come first).
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-ffplay
      - --disable-doc
      - --disable-debug
      - --enable-gpl
      # OpenSSL 3 is Apache-2.0, which only GPLv3 can combine with -- and the
      # bundle is GPL-3.0-or-later already, because of mpv.
      - --enable-version3
      - --enable-openssl         # https:// streams
      - --enable-libdav1d
      - --enable-libdrm
      - --enable-vaapi
      - --enable-vulkan
      # FFmpeg's DVD-Video reader, for the DVD ripper's MKVs (libdvdread decrypts with libdvdcss).
      - --enable-libdvdread
      - --enable-libdvdnav
      # The DVD ripper's MKVs in H.264 and H.265 (the modules above).
      - --enable-libx264
      - --enable-libx265
      # NVENC off: with the 25.08 runtime's nv-codec-headers 13, ffmpeg 8.0's
      # nvenc.c failed to compile (a renamed field; the same fix Apricot Studio
      # needed), and nothing here encodes with it: a player only decodes, the
      # DVD ripper uses x264 and x265, and NVDEC/CUVID are unaffected.
      - --disable-nvenc
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
        sha256: 1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433

  # No BD-J (Java menus): titles play directly.
  - name: libbluray
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_tools=false
      - -Denable_examples=false
      - -Dbdj_jar=disabled
      - -Dembed_udfread=false
    sources:
      # 1.5.1 is a git tag only (VideoLAN published no tarball for it).
      - type: git
        url: https://code.videolan.org/videolan/libbluray.git
        tag: 1.5.1
        commit: a24f4fad4d62893de647abc8671397747b2359dd

  # ---- libmpv ------------------------------------------------------------
  # Only the library: the app is the player, so the mpv command-line binary,
  # its OSC and its manual are not built.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dx11=enabled
      - -Dwayland=enabled
      - -Dvulkan=enabled
      - -Degl=enabled
      - -Dvaapi=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dlcms2=enabled
      - -Dlibarchive=enabled
      - -Dlibbluray=enabled
      - -Ddvdnav=enabled
      - -Dcdda=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
        sha256: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd

  # ---- libVLC: plays discs with their menus ------------------------------
  # mpv plays everything else but has no DVD or Blu-ray menu support, so discs
  # go through libVLC, and so do Audio CDs (its CD-DA reader). Only the library
  # is built (no VLC app or interfaces), with the disc, FFmpeg and PulseAudio
  # modules a disc player needs. VLC's own libplacebo support is off: it
  # predates the libplacebo mpv uses. vlc-bwdif.patch adds BWDIF to VLC's
  # deinterlacer, run for its yadif2x mode, so discs deinterlace like files.
  - name: vlc
    build-options:
      env:
        BUILDCC: gcc -std=gnu99 # VLC builds a few helper tools with the native compiler
      # libVLC's plugin cache (below) records each plugin's size and time. Splitting debug info
      # out afterwards changed the sizes, which made the cache stale: every plugin was opened at
      # each start. So no debug info, and nothing touches the plugins after the cache is made:
      # the modules after this one don't split debug info either, as flatpak-builder's
      # post-processing of a later module reaches back to libVLC's files.
      cflags: -O2 -pipe
      cflags-override: true
      cxxflags: -O2 -pipe
      cxxflags-override: true
      no-debuginfo: true
    config-opts:
      - --disable-vlc
      - --disable-qt
      - --disable-skins2
      - --disable-lua
      - --disable-ncurses
      - --disable-nls
      - --disable-a52
      - --disable-mad
      - --disable-mod
      - --disable-mpc
      - --disable-taglib
      - --disable-live555
      - --disable-libplacebo
      - --disable-decklink
      - --disable-jack
      - --disable-sndio
      - --disable-alsa
      - --disable-v4l2
      - --disable-libcddb
      - --disable-addonmanagermodules
      - --disable-vlm
      # Stream output stays in: libVLC's snapshots (a disc's screenshots) encode their PNG through
      # it. Without it every DVD screenshot failed ("Encoding support not compiled-in!").
      - --disable-chromecast
      - --disable-update-check
      - --disable-wayland
      - --disable-dbus
      - --enable-dvdnav
      - --enable-dvdread
      - --enable-bluray
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-pulse
    post-install:
      # The plugin cache makes libVLC start in milliseconds instead of opening every plugin.
      # Installed Flatpak files all have the time 0, so the cache is made with that time.
      - find /app/lib/vlc/plugins -name '*.so' -exec touch -h -d @0 {} +
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    cleanup:
      - /share/vlc/lua
      - /share/applications
      - /share/icons
      - /share/metainfo
      - /share/kde4
      - /share/locale
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
      - type: patch
        path: vlc/vlc-bwdif.patch

  # ---- the torrent engine (Rust) -----------------------------------------
  # Cargo needs its crates and a flatpak build has no network. --share=network
  # is fine for a local build; for Flathub, run
  # packaging/flatpak/generate-sources.sh, add cargo-sources.json to `sources`
  # and drop the build-args line.
  - name: paramaja-torrent
    buildsystem: simple
    build-options:
      no-debuginfo: true # keeps libVLC's plugin cache valid (see vlc)
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/paramaja-torrent/cargo
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --lib --manifest-path native/paramaja-torrent/Cargo.toml
      - install -Dm755 native/paramaja-torrent/target/release/libparamaja_torrent.so -t /app/lib/paramaja/
    sources:
      - type: dir
        path: ..
        # The checkout's own build outputs: gigabytes, and none of them belong
        # in a clean build.
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/paramaja-torrent/target
          - src/Paramaja.App/bin
          - src/Paramaja.App/obj
          - src/Paramaja.Core/bin
          - src/Paramaja.Core/obj
          - tests

  # ---- the application (C# / Avalonia) -----------------------------------
  # Published self-contained, so the .NET runtime travels with the app rather
  # than being another extension to install. Same network note as above, with
  # nuget-sources.json from the same script.
  - name: paramaja
    buildsystem: simple
    build-options:
      no-debuginfo: true # keeps libVLC's plugin cache valid (see vlc)
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
        DOTNET_CLI_HOME: /run/build/paramaja
        NUGET_PACKAGES: /run/build/paramaja/nuget
      build-args:
        - --share=network
    build-commands:
      - dotnet publish src/Paramaja.App -c Release -r linux-x64 --self-contained true
        -p:DebugType=none -p:ParamajaNativeRid=none -o /app/lib/paramaja
      - install -Dm755 packaging/flatpak/paramaja.sh /app/bin/paramaja
      # YouTube and other sites: yt-dlp, QuickJS (the JavaScript runtime YouTube
      # needs) and ffmpeg (merges downloads), where the app looks for them.
      - install -Dm755 yt-dlp_linux /app/lib/paramaja/yt-dlp
      - install -Dm755 qjs-linux-x86_64 /app/lib/paramaja/qjs
      - ln -sf /app/bin/ffmpeg /app/lib/paramaja/ffmpeg
      - ln -sf /app/bin/ffprobe /app/lib/paramaja/ffprobe
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.svg
        -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 src/Paramaja.App/Assets/paramaja-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.raulblideran.Paramaja.png
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.metainfo.xml
        -t /app/share/metainfo/
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp_linux
        sha256: 249ddb058234276bc449b9cd9492aad9f133bda5923c61a9e39983ae114ef17d
      - type: file
        url: https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-linux-x86_64
        sha256: 85ded23b9fabe8c1644fc40a8d2bbdd71157affcbd807359c618cc717ee24d7d
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/paramaja-torrent/target
          - src/Paramaja.App/bin
          - src/Paramaja.App/obj
          - src/Paramaja.Core/bin
          - src/Paramaja.Core/obj
          - tests
